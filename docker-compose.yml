services:
  nemo-ai:
    image: nemo/nemo:latest
    container_name: assisv2
    ports:
      - "5000:3000"
      - "5555:5555"
    environment:
      # OpenAI configuration
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # GitLab configuration
      GITLAB_URL: ${GITLAB_URL}
      GITLAB_TOKEN: ${GITLAB_TOKEN}

      # Admin configuration
      ADMIN_INIT_PASS: ${ADMIN_INIT_PASS}
      JWT_SECRET: ${JWT_SECRET}

      # Database configuration  
      DATABASE_URL: ${DATABASE_URL}
    # For development with hot reload, uncomment volumes:
    # volumes:
    #   - .:/app
    #   - /app/node_modules